# Minimal Gitea Mirror deployment
# Only includes what CANNOT be configured via the Web UI
# Everything else can be set up through the web interface after deployment

services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    container_name: gitea-mirror
    restart: unless-stopped
    ports:
      - "${PORT:-4321}:4321"
    user: ${PUID:-1000}:${PGID:-1000}
    # The app runs as a regular user and needs no Linux capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
    environment:
      # === SECRETS ===
      # Signs sessions. Left empty, the container generates one and keeps it in ./data.
      # To set your own: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" > .env
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:4321}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:4321}
      # REVERSE PROXY: If accessing via a reverse proxy, set both to your external URL:
      #   BETTER_AUTH_URL=https://gitea-mirror.example.com
      #   BETTER_AUTH_TRUSTED_ORIGINS=https://gitea-mirror.example.com
      # Path-prefix deployments (e.g. /mirror) are supported at runtime via BASE_URL.
      
      # === CORE SETTINGS ===
      # These are technically required but have working defaults
      - NODE_ENV=production
      - DATABASE_URL=file:data/gitea-mirror.db
      - HOST=0.0.0.0
      - PORT=4321
      - BASE_URL=${BASE_URL:-/}
      
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "BASE=\"${BASE_URL:-/}\"; if [ \"$${BASE}\" = \"/\" ]; then BASE=\"\"; else BASE=\"$${BASE%/}\"; fi; wget --no-verbose --tries=3 --spider \"http://localhost:4321$${BASE}/api/health\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

# === QUICK START ===
#
# 1. Create a .env file with only ONE required variable:
#    BETTER_AUTH_SECRET=your-32-character-minimum-secret-key-here
#
# 2. Run:
#    docker-compose -f docker-compose.alt.yml up -d
#
# 3. Access at http://localhost:4321
#
# 4. Sign up for an account (first user becomes admin)
#
# 5. Configure everything else through the web UI:
#    - GitHub credentials
#    - Gitea credentials  
#    - Mirror settings
#    - Scheduling options
#    - Auto-import settings
#    - Cleanup preferences
#
# That's it! Everything else can be configured via the web interface.
