name: Scout VEX debug (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/scout-vex-debug.yml

permissions:
  contents: read

jobs:
  vex:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build VEX variants
        run: |
          python3 - <<'EOF'
          import copy, json, os
          base = json.load(open(".vex/zlib-gz-vacate.vex.json"))
          index = "sha256:80f9cd44224934038a70383b3a14be436414180792397a040d7053cd14be120e"
          amd64 = "sha256:650a1f68520e93c7ea5be2ea2599649285487abfae408ddc652ee30c46baa9de"
          def variant(name, products):
              doc = copy.deepcopy(base)
              for st in doc["statements"]:
                  st["products"] = [{"@id": p} for p in products]
              os.makedirs(f"vex-{name}", exist_ok=True)
              json.dump(doc, open(f"vex-{name}/zlib.vex.json", "w"), indent=2)
          variant("g-repo-url", ["pkg:docker/raylabshq/gitea-mirror?repository_url=ghcr.io"])
          variant("h-repo-url-tag", ["pkg:docker/raylabshq/gitea-mirror@v3.43.0?repository_url=ghcr.io"])
          variant("i-repo-url-full", ["pkg:docker/raylabshq/gitea-mirror?repository_url=ghcr.io%2Fraylabshq%2Fgitea-mirror"])
          variant("j-digest-index", [f"pkg:docker/raylabshq/gitea-mirror@{index}?repository_url=ghcr.io"])
          variant("k-digest-amd64", [f"pkg:docker/raylabshq/gitea-mirror@{amd64}?repository_url=ghcr.io&platform=linux%2Famd64"])
          EOF
          ls -d vex-*

      - name: g-repo-url
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-g-repo-url, vex-author: developer@arunavoray.dev, only-vex-affected: true, sarif-file: g.sarif }
      - name: h-repo-url-tag
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-h-repo-url-tag, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: i-repo-url-full
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-i-repo-url-full, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: j-digest-index
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-j-digest-index, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: k-digest-amd64
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-k-digest-amd64, vex-author: developer@arunavoray.dev, only-vex-affected: true }

      - name: Image purls Scout reports
        if: always()
        run: grep -o '"pkg:docker/[^"]*"' g.sarif | sort -u | head -20 || true
