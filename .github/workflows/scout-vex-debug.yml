name: Scout VEX debug (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/scout-vex-debug.yml

permissions:
  contents: read

jobs:
  vex:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build VEX variants
        run: |
          python3 - <<'EOF'
          import copy, json, os
          base = json.load(open(".vex/zlib-gz-vacate.vex.json"))
          zlib_ver = "pkg:deb/debian/zlib@1:1.3.dfsg%2Breally1.3.1-1?os_distro=trixie&os_name=debian&os_version=13"
          def variant(name, mutate):
              doc = copy.deepcopy(base)
              for st in doc["statements"]:
                  mutate(st)
              os.makedirs(f"vex-{name}", exist_ok=True)
              json.dump(doc, open(f"vex-{name}/zlib.vex.json", "w"), indent=2)
          variant("a-control", lambda st: None)
          variant("b-sub-noversion", lambda st: [p.__setitem__("subcomponents", [{"@id": "pkg:deb/debian/zlib"}]) for p in st["products"]])
          variant("c-sub-version", lambda st: [p.__setitem__("subcomponents", [{"@id": zlib_ver}]) for p in st["products"]])
          variant("d-tagged-product", lambda st: st.__setitem__("products", [{"@id": "pkg:docker/ghcr.io/raylabshq/gitea-mirror@v3.43.0"}, {"@id": "pkg:docker/raylabshq/gitea-mirror@v3.43.0"}]))
          variant("e-base-image", lambda st: st.__setitem__("products", st["products"] + [{"@id": "pkg:docker/oven/bun"}, {"@id": "pkg:docker/debian"}, {"@id": "pkg:docker/library/debian"}]))
          variant("f-new-timestamp", lambda st: st.__setitem__("timestamp", "2026-10-23T00:00:00Z"))
          EOF
          ls -d vex-*

      - name: a-control
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-a-control, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: b-sub-noversion
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-b-sub-noversion, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: c-sub-version
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-c-sub-version, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: d-tagged-product
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-d-tagged-product, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: e-base-image
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-e-base-image, vex-author: developer@arunavoray.dev, only-vex-affected: true }
      - name: f-new-timestamp
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with: { command: cves, image: "ghcr.io/raylabshq/gitea-mirror:v3.43.0", only-severities: "critical,high", exit-code: false, summary: false, write-comment: false, vex-location: vex-f-new-timestamp, vex-author: developer@arunavoray.dev, only-vex-affected: true }
